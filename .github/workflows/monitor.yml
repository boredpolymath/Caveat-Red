name: Pages availability and asset integrity

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check production app shell
        run: curl --fail --location --retry 3 --max-time 30 --silent --show-error https://boredpolymath.github.io/Caveat-Red/ | grep -q 'Caveat Red'
      - name: Check manifest and service worker
        run: |
          curl --fail --location --retry 3 --max-time 30 --silent --show-error https://boredpolymath.github.io/Caveat-Red/manifest.webmanifest | grep -q 'Caveat Red'
          curl --fail --location --retry 3 --max-time 30 --silent --show-error https://boredpolymath.github.io/Caveat-Red/sw.js | grep -q 'caveat-red-v'
